/* Public-browser compatibility layer: replaces Claude-only db/downloads with
   browser localStorage + /api/search (Gemini) + native browser downloads. */
(() => {
  const KEYS = {
    ofertas: 'market-benchmark-gemini-offers-v1',
    solicitudes: 'market-benchmark-gemini-requests-v1'
  };
  const listeners = { ofertas: new Set(), solicitudes: new Set() };
  const memory = { ofertas: [], solicitudes: [] };

  const load = (name) => {
    try {
      const raw = localStorage.getItem(KEYS[name]);
      if (raw != null) { memory[name] = JSON.parse(raw || '[]'); return memory[name]; }
    } catch {}
    return memory[name] || [];
  };
  const save = (name, rows) => {
    memory[name] = rows;
    try { localStorage.setItem(KEYS[name], JSON.stringify(rows)); } catch {}
    emit(name);
  };
  const emit = (name) => {
    const docs = load(name).map(row => ({ id: row.id, data: () => ({ ...row }) }));
    const snapshot = { docs };
    listeners[name].forEach(fn => { try { fn(snapshot); } catch {} });
  };
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));

  const db = {
    collection(name) {
      if (!KEYS[name]) throw new Error('Unknown collection: ' + name);
      return {
        onSnapshot(success, failure) {
          listeners[name].add(success);
          queueMicrotask(() => { try { emit(name); } catch (e) { failure && failure(e); } });
          return () => listeners[name].delete(success);
        },
        async add(data) {
          if (name !== 'solicitudes') throw new Error('Writes are only supported for search requests.');
          const request = { ...data, id: uid(), estado: 'pendiente' };
          save('solicitudes', [...load('solicitudes'), request]);
          try {
            const response = await fetch('/api/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ cargo: data.cargo, pais: data.pais, ciudad: data.ciudad || '', idioma: data.idioma || 'es' })
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload.error || 'Gemini search failed.');
            const current = load('ofertas');
            const byId = new Map(current.map(o => [o.id, o]));
            (payload.ofertas || []).forEach(o => byId.set(o.id, o));
            save('ofertas', [...byId.values()]);
            save('solicitudes', load('solicitudes').map(r => r.id === request.id ? { ...r, estado: 'completada' } : r));
            return { id: request.id, count: (payload.ofertas || []).length };
          } catch (e) {
            save('solicitudes', load('solicitudes').map(r => r.id === request.id ? { ...r, estado: 'error', error: e.message } : r));
            throw e;
          }
        }
      };
    },
    doc(path) {
      const [name, id] = String(path).split('/');
      return {
        async delete() {
          if (!KEYS[name]) throw new Error('Unknown collection: ' + name);
          save(name, load(name).filter(row => row.id !== id));
        }
      };
    }
  };

  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename || 'download';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
  };

  window.claude = {
    async use(name) {
      if (name === 'db') return db;
      if (name === 'downloads') return downloads;
      return null;
    }
  };
})();
</script>

:root{--bg:#F6F8F6;--panel:#FFFFFF;--ink:#1F2E4A;--muted:#4A5A78;--line:#DCE3DE;--sage:#5C7A6B;--sagem:#B7C9BE;--sagel:#E8EFEA;--gold:#C29A3F;--goldl:#F5ECD6;--fill:#1F2E4A;--head:#1F2E4A;--bad:#A6423A;--badl:#F6E3E1;--warnl:#FBF6EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161E;--panel:#19202B;--ink:#E6ECF4;--muted:#A9B4C6;--line:#2C3646;--sage:#8FB3A0;--sagem:#3E5A4C;--sagel:#22302A;--gold:#D4AF5A;--goldl:#3A3222;--fill:#9DB3D6;--head:#0D1B33;--bad:#E58A80;--badl:#3B2523;--warnl:#2E2818}}
:root[data-theme="dark"]{--bg:#11161E;--panel:#19202B;--ink:#E6ECF4;--muted:#A9B4C6;--line:#2C3646;--sage:#8FB3A0;--sagem:#3E5A4C;--sagel:#22302A;--gold:#D4AF5A;--goldl:#3A3222;--fill:#9DB3D6;--head:#0D1B33;--bad:#E58A80;--badl:#3B2523;--warnl:#2E2818}
.bc{font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);min-height:100%;font-variant-numeric:tabular-nums;line-height:1.45}
.bc *{box-sizing:border-box}
.bc header{background:var(--head);color:#fff;padding:20px 16px 22px}
.bc .tope{max-width:980px;margin:0 auto}
.bc h1{font-size:20px;font-weight:700;margin:0 0 4px}
.bc header p{margin:0 0 14px;color:#C9D3E2;font-size:14px}
.bc label{display:block;font-size:13px;color:#C9D3E2;margin-bottom:10px}
.bc input,.bc select{width:100%;max-width:100%;margin-top:4px;padding:11px 12px;border-radius:8px;border:1px solid #3A4B6B;font:inherit;font-size:16px;color:#1F2E4A;background:#fff}
.bc .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bc button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 16px;font-weight:600;color:var(--ink)}
.bc .prim{background:var(--gold);color:#1F2E4A;width:100%;font-size:16px;margin-top:4px}
.bc button:disabled{opacity:.55;cursor:wait}
.bc .enlace{background:none;color:#C9D3E2;text-decoration:underline;padding:6px 0;font-weight:400;font-size:13px}
.bc .estado{margin-top:12px;padding:10px 12px;border-radius:8px;background:#2A3C5E;color:#E6ECF4;font-size:14px}
.bc .estado.error{background:#F6E3E1;color:#A6423A}
.bc main{padding:16px;max-width:980px;margin:0 auto}
.bc .seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bc .seg button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:500;padding:8px 12px;font-size:14px}
.bc .seg button.on{background:var(--fill);border-color:var(--fill);color:var(--panel)}
.bc .seg .ppt{background:var(--gold);border-color:var(--gold);color:#1F2E4A;font-weight:600}
.bc .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.bc h2{font-size:17px;margin:0 0 2px;font-weight:700}
.bc h3{font-size:15px;margin:0 0 8px;font-weight:700}
.bc .nota{color:var(--muted);font-size:13px;margin:0 0 12px}
.bc .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.bc .tres div{border-left:3px solid var(--line);padding-left:10px}
.bc .tres div.dest{border-color:var(--gold)}
.bc .tres b{display:block;font-size:20px}
.bc .tres small{color:var(--muted);font-size:12px}
.bc .banda{position:relative;height:46px;margin:16px 6px 4px}
.bc .eje{position:absolute;top:22px;left:0;right:0;height:2px;background:var(--line)}
.bc .caja{position:absolute;top:10px;height:26px;background:var(--sagel);border:1px solid var(--sagem);border-radius:6px}
.bc .med{position:absolute;top:4px;width:4px;height:38px;background:var(--gold);border-radius:2px;margin-left:-2px}
.bc .pt{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--fill);opacity:.7;margin-left:-4.5px}
.bc .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.bc .mini div{border-left:3px solid var(--gold);padding-left:10px}
.bc .mini b{display:block;font-size:18px}
.bc .mini small{color:var(--muted);font-size:12px}
.bc .barra{height:6px;background:var(--sagel);border-radius:3px;overflow:hidden;margin:4px 0 10px}
.bc .barra span{display:block;height:100%;background:var(--sage)}
.bc .fr{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.bc .fr em{font-style:normal;color:var(--muted);white-space:nowrap}
.bc .apilada{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0 12px;background:var(--sagel)}
.bc .oferta{border-top:1px solid var(--line);padding:12px 0;font-size:13px}
.bc .oferta a,.bc .oferta .tit{color:var(--sage);font-weight:600;font-size:14px}
.bc .oferta .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.bc .oferta .datos b{display:block;font-size:13px}
.bc .meta{color:var(--muted)}
.bc .chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--goldl);font-size:12px;margin:2px 4px 0 0;white-space:nowrap}
.bc .chip.s{background:var(--sagel)}
.bc .alerta{background:var(--warnl);margin:0 -16px;padding:12px 16px}
.bc .quitar{background:none;color:var(--muted);padding:4px 0;font-weight:400;font-size:12px;text-decoration:underline}
.bc .vacio{text-align:center;color:var(--muted);padding:40px 10px}
.bc .en{opacity:.62;font-weight:inherit}
.bc .tabla{overflow-x:auto}
.bc table{width:100%;border-collapse:collapse;font-size:13px}
.bc th{text-align:right;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:2px solid var(--line)}
.bc th:first-child,.bc td:first-child{text-align:left}
.bc td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.bc .pend{margin-top:10px;font-size:13px;color:#C9D3E2}
.bc .pend b{color:#fff}
.bc .config{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin:6px 0 12px;font-size:13px;color:#C9D3E2}
.bc .config a{color:#F3E9CF}
.bc .config ol{margin:6px 0 10px;padding-left:20px}
@media(min-width:760px){.bc .fila{grid-template-columns:2fr 1fr 1fr 1fr}.bc .mini{grid-template-columns:repeat(4,1fr)}.bc .dos{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
